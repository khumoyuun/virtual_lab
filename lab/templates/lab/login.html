{% extends 'lab/base.html' %}
{% load i18n %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <h4 class="card-title text-center mb-4 text-success fw-bold">{% trans "Tizimga kirish" %}</h4>
                <form method="POST">
                    {% csrf_token %}
                    {% for field in form %}
                        <div class="mb-3">
                            <label class="form-label fw-semibold text-secondary">{{ field.label }}</label>
                            {{ field }}
                        </div>
                    {% endfor %}
                    <button type="submit" class="btn btn-success w-100 mt-3 fw-bold">{% trans "Kirish" %}</button>
                </form>
                <div class="text-center mt-4 small">
                    <span class="text-muted">{% trans "Akkauntingiz yo'qmi?" %}</span>
                    <a href="{% url 'register' %}" class="text-success fw-bold text-decoration-none">{% trans "Ro'yxatdan o'ting" %}</a>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    document.querySelectorAll('input').forEach(input => {
        input.classList.add('form-control');
    });
</script>
{% endblock %}
