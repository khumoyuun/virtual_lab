<!DOCTYPE html>
<html lang="uz" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoLab - Virtual Lab</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { transition: background-color 0.3s, color 0.3s; }
        .navbar-brand { font-weight: bold; color: #198754 !important; }
        /* Google Translate ning tepadan chiqadigan xunuk qatorini yashirish */
        .goog-te-banner-frame.skiptranslate { display: none !important; }
        body { top: 0px !important; }
        /* Til tanlash tugmasini chiroyli qilish */
        .goog-te-combo { padding: 5px; border-radius: 5px; border: 1px solid #ccc; background-color: var(--bs-body-bg); color: var(--bs-body-color); outline: none; cursor: pointer; }
    </style>
</head>
<body class="bg-body-tertiary">

    <nav class="navbar navbar-expand-lg bg-body shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand" href="{% url 'dashboard' %}">🌱 EcoLab</a>

            {% if user.is_authenticated %}
            <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-3">
                <li class="nav-item">
                    <a class="nav-link fw-semibold" href="{% url 'dashboard' %}">Laboratoriya</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link fw-semibold text-success" href="{% url 'guide' %}">📚 Eko-Qo'llanma</a>
                </li>
            </ul>
            {% endif %}

            <div class="d-flex align-items-center">
                <div id="google_translate_element" class="me-3 mt-1"></div>

                <button id="themeToggle" class="btn btn-outline-secondary btn-sm me-3">🌙 Tungi Rejim</button>

                {% if user.is_authenticated %}
                    <span class="navbar-text me-3 small d-none d-md-block">Salom, <b>{{ user.first_name }}</b></span>
                    <a href="{% url 'logout' %}" class="btn btn-outline-danger btn-sm">Chiqish</a>
                {% else %}
                    <a href="{% url 'login' %}" class="btn btn-outline-success btn-sm me-2">Kirish</a>
                    <a href="{% url 'register' %}" class="btn btn-success btn-sm">Ro'yxatdan o'tish</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <div class="container pb-5">
        {% block content %}
        {% endblock %}
    </div>

    <script type="text/javascript">
        // 1. Google Translate
        function googleTranslateElementInit() {
            new google.translate.TranslateElement({
                pageLanguage: 'uz',
                includedLanguages: 'ru,uz,en',
                layout: google.translate.TranslateElement.InlineLayout.SIMPLE
            }, 'google_translate_element');
        }

        // 2. Dark/Light Mode
        const toggleBtn = document.getElementById('themeToggle');
        const htmlTag = document.documentElement;

        if (localStorage.getItem('theme') === 'dark') {
            htmlTag.setAttribute('data-bs-theme', 'dark');
            toggleBtn.innerHTML = '☀️ Kunduzgi Rejim';
        }

        toggleBtn.addEventListener('click', function() {
            if (htmlTag.getAttribute('data-bs-theme') === 'dark') {
                htmlTag.setAttribute('data-bs-theme', 'light');
                localStorage.setItem('theme', 'light');
                this.innerHTML = '🌙 Tungi Rejim';
            } else {
                htmlTag.setAttribute('data-bs-theme', 'dark');
                localStorage.setItem('theme', 'dark');
                this.innerHTML = '☀️ Kunduzgi Rejim';
            }
        });
    </script>
    <script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</body>
</html>
